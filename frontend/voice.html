<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cypher Voice</title>
  </head>
  <body>
    <main class="voice-shell">
      <section class="voice-card">
        <div class="eyebrow">CYPHER // CONVERSATION LOOP</div>
        <h1>VOICE CONSOLE</h1>
        <p id="status" class="status">READY</p>

        <div id="core" class="cypher-core" data-state="ready" aria-hidden="true">
          <div class="core-ring ring-one"></div>
          <div class="core-ring ring-two"></div>
          <div class="core-ring ring-three"></div>
          <div class="core-center">C</div>
        </div>

        <div class="system-strip">
          <div><span>VOICE</span><strong id="voice-name">DETECTING</strong></div>
          <div><span>SESSION</span><strong id="session-time">WAKE WORD</strong></div>
          <div><span>MODEL</span><strong>QWEN 2.5</strong></div>
        </div>

        <button id="listen" class="listen" type="button">
          START LISTENING
        </button>

        <form id="message-form">
          <label for="message">COMMAND OR QUESTION</label>
          <div class="message-row">
            <input
              id="message"
              autocomplete="off"
              placeholder="Set a timer for ten seconds"
            />
            <button type="submit">SEND</button>
          </div>
        </form>

        <div class="exchange">
          <div>
            <span>YOU</span>
            <p id="transcript">---</p>
          </div>
          <div>
            <span>CYPHER</span>
            <p id="reply">---</p>
          </div>
        </div>

        <label class="speak-toggle">
          <input id="speak" type="checkbox" checked />
          SPEAK RESPONSES
        </label>

        <section class="history-panel">
          <div class="history-title">RECENT EXCHANGE</div>
          <div id="history" class="history-list">
            <p class="history-empty">NO CONVERSATION YET</p>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/voice.ts"></script>
  </body>
</html>
